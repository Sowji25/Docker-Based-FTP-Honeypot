version: "3.9"

services:
  ftp:
    build: .
    container_name: honeypot-ftp
    working_dir: /app
    command: python -u -m ftp.ftp_server
    volumes:
      - .:/app
    ports:
      - "2121:2121"
    depends_on:
      - db

  web:
    build: .
    container_name: honeypot-web
    working_dir: /app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: honeypot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sowji@2005
      POSTGRES_DB: honeypot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: honeypot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    container_name: honeypot-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - db

volumes:
  postgres_data:
  grafana_data: